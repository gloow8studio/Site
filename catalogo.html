<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catálogo Web Portas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;1,500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .top-nav .menu-icon, .top-nav .search-icon {
      font-size: 1.4rem;
      color: #fff;
      cursor: pointer;
    }

    .top-nav .mini-logo {
      width: 40px;
      height: 40px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #444;
    }

    .top-nav .mini-logo span {
      color: #fff;
      font-size: 0.6rem;
      text-align: center;
      line-height: 1.2;
    }

    .top-nav .mini-logo span .green {
      color: #00e676;
    }

    /* Main Logo Area */
    .hero-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .main-logo {
      display: flex;
      align-items: flex-start;
      position: relative;
    }

    .logo-bracket {
      width: 40px;
      height: 60px;
      border-top: 4px solid #00e676;
      border-left: 4px solid #00e676;
      border-bottom: 4px solid #00e676;
      margin-right: 10px;
    }

    .logo-text-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .logo-text-area h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0;
      line-height: 1;
    }

    .logo-text-area p {
      font-size: 0.8rem;
      color: #ccc;
      margin-top: 5px;
    }

    /* Section Title */
    .section-title {
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }

    .section-title h2 {
      color: #00e676;
      font-size: 1.5rem;
      font-weight: 500;
      font-style: italic;
      margin-bottom: 10px;
    }

    .section-title .divider {
      width: 80%;
      height: 2px;
      background: #00e676;
      margin: 0 auto;
    }

    /* Lines Container */
    .lines-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 10px 15px 40px 15px;
    }

    /* Line Card */
    .line-card {
      display: flex;
      height: 120px;
      background: #0a0a0a;
      overflow: hidden;
      position: relative;
    }

    /* Halftone pattern background for right side */
    .line-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 50%;
      background-image: radial-gradient(#00e676 15%, transparent 16%), radial-gradient(#00e676 15%, transparent 16%);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      opacity: 0.15;
      z-index: 0;
    }

    .line-img {
      width: 50%;
      height: 100%;
      background-size: cover;
      background-position: center;
      position: relative;
      z-index: 1;
    }

    .line-info {
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .line-info span {
      color: #00e676;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      align-self: flex-start;
      margin-left: 20px;
      margin-bottom: 5px;
    }

    .mini-logo-box {
      border: 2px solid #00e676;
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mini-logo-box .w {
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      line-height: 1;
    }

    .mini-logo-box .p {
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      line-height: 1;
    }

    .line-name {
      color: #00e676;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 5px;
      align-self: flex-end;
      margin-right: 20px;
    }

    /* Images */
    .img-essencial {
      background-image: url('https://images.unsplash.com/photo-1596394879944-cb8cb214f7b6?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80'); /* Light Wood */
    }
    .img-eco {
      background-image: url('https://images.unsplash.com/photo-1596350352210-911295db2e65?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80'); /* Rustic Wood */
    }
    .img-premium {
      background-image: url('https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80'); /* Dark Wood */
    }

  </style>
</head>
<body>

  <!-- Top Nav -->
  <div class="top-nav">
    <i class="fas fa-bars menu-icon"></i>
    <div class="mini-logo">
      <span>web<br>portas</span>
    </div>
    <i class="fas fa-search search-icon"></i>
  </div>

  <!-- Main Logo -->
  <div class="hero-logo-container">
    <div class="main-logo">
      <div class="logo-bracket"></div>
      <div class="logo-text-area">
        <h1>webportas</h1>
        <p>Catálogo de Produtos</p>
      </div>
    </div>
  </div>

  <!-- Section Title -->
  <div class="section-title">
    <h2>Linhas de Esquadrias</h2>
    <div class="divider"></div>
  </div>

  <!-- Lines -->
  <div class="lines-container">
    
    <!-- Linha Essencial -->
    <div class="line-card">
      <div class="line-img img-essencial"></div>
      <div class="line-info">
        <span>Linha</span>
        <div class="mini-logo-box">
          <div class="w">web</div>
          <div class="p">portas</div>
        </div>
        <div class="line-name">Essencial</div>
      </div>
    </div>

    <!-- Linha Eco -->
    <div class="line-card">
      <div class="line-img img-eco"></div>
      <div class="line-info">
        <span>Linha</span>
        <div class="mini-logo-box">
          <div class="w">web</div>
          <div class="p">portas</div>
        </div>
        <div class="line-name">Eco</div>
      </div>
    </div>

    <!-- Linha Decor/Premium -->
    <div class="line-card">
      <div class="line-img img-premium">
        <!-- Info Icon -->
        <i class="fas fa-info-circle" style="position:absolute; bottom:10px; left:10px; font-size:1.5rem; color:rgba(255,255,255,0.7);"></i>
      </div>
      <div class="line-info">
        <span>Linha</span>
        <div class="mini-logo-box">
          <div class="w">web</div>
          <div class="p">portas</div>
        </div>
        <div class="line-name">Decor</div>
      </div>
    </div>

  </div>

</body>
</html>
